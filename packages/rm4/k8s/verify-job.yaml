apiVersion: batch/v1
kind: Job
metadata:
  name: rm4-verify
  namespace: komtas-rm4
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rm4-verify
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: postgres:17.11-bookworm
          command: [psql, --no-psqlrc, -v, ON_ERROR_STOP=1, -f, /sql/verify.sql]
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: komtas_rm4
            - name: PGUSER
              value: rm4_bi
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rm4-credentials
                  key: bi-password
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: rm4-sql

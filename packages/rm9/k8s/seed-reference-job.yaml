apiVersion: batch/v1
kind: Job
metadata:
  name: rm9-seed-reference
  namespace: komtas-rm9
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rm9-seed-reference
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: postgres:17.11-bookworm
          command: [psql, --no-psqlrc, -v, ON_ERROR_STOP=1, -f, /sql/seed-reference.sql]
          env:
            - name: PGHOST
              value: postgres-reference
            - name: PGDATABASE
              value: komtas_rm9_reference
            - name: PGUSER
              value: rm9_admin
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rm9-credentials
                  key: admin-password
            - name: PBI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rm9-credentials
                  key: bi-password
            - name: DBT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rm9-credentials
                  key: dbt-password
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: rm9-sql

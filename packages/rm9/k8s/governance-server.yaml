{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "openmetadata",
        "namespace": "komtas-rm9"
      },
      "spec": {
        "type": "ClusterIP",
        "selector": {
          "app": "rm9-openmetadata"
        },
        "ports": [
          {
            "name": "http",
            "port": 8585,
            "targetPort": 8585
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "openmetadata",
        "namespace": "komtas-rm9"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "rm9-openmetadata"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "rm9-openmetadata"
            }
          },
          "spec": {
            "enableServiceLinks": false,
            "containers": [
              {
                "name": "openmetadata",
                "image": "docker.getcollate.io/openmetadata/server:2.0.7",
                "command": [
                  "/bin/bash",
                  "/openmetadata-start.sh"
                ],
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "rm9-om-config"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "DB_USER_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "rm9-governance",
                        "key": "database-password"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "768Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "2Gi"
                  }
                },
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 8585
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/healthcheck",
                    "port": 8586
                  },
                  "failureThreshold": 180,
                  "periodSeconds": 5
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/healthcheck",
                    "port": 8586
                  },
                  "periodSeconds": 5
                }
              }
            ]
          }
        }
      }
    }
  ]
}

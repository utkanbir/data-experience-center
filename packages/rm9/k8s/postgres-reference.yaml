apiVersion: v1
kind: Service
metadata:
  name: postgres-reference
  namespace: komtas-rm9
spec:
  type: ClusterIP
  ports:
    - name: pgref
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres-reference-rm1
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-reference-headless
  namespace: komtas-rm9
spec:
  clusterIP: None
  ports:
    - name: pgref
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres-reference-rm1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-reference
  namespace: komtas-rm9
spec:
  serviceName: postgres-reference-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-reference-rm1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-reference-rm1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: pgref
          image: postgres:17.11-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgref
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: komtas_rm9_reference
            - name: POSTGRES_USER
              value: rm9_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rm9-credentials
                  key: admin-password
            - name: PGDATA
              value: /var/lib/postgres-referenceql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            exec:
              command: [pg_isready, -U, rm9_admin, -d, komtas_rm9_reference]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, rm9_admin, -d, komtas_rm9_reference]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, rm9_admin, -d, komtas_rm9_reference]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgres-referenceql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi

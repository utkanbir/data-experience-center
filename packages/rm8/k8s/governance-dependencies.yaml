{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "metadata-postgres",
        "namespace": "komtas-rm8"
      },
      "spec": {
        "type": "ClusterIP",
        "selector": {
          "app": "rm8-metadata-postgres"
        },
        "ports": [
          {
            "name": "http",
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "metadata-postgres",
        "namespace": "komtas-rm8"
      },
      "spec": {
        "serviceName": "metadata-postgres",
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "rm8-metadata-postgres"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "rm8-metadata-postgres"
            }
          },
          "spec": {
            "enableServiceLinks": false,
            "containers": [
              {
                "name": "metadata-postgres",
                "image": "postgres:17.11-bookworm",
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "value": "openmetadata_db"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "value": "openmetadata_user"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "rm8-governance",
                        "key": "database-password"
                      }
                    }
                  },
                  {
                    "name": "PGDATA",
                    "value": "/var/lib/postgresql/data/pgdata"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "512Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "pg_isready",
                      "-U",
                      "openmetadata_user",
                      "-d",
                      "openmetadata_db"
                    ]
                  },
                  "periodSeconds": 5
                }
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "3Gi"
                }
              }
            }
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "elasticsearch",
        "namespace": "komtas-rm8"
      },
      "spec": {
        "type": "ClusterIP",
        "selector": {
          "app": "rm8-elasticsearch"
        },
        "ports": [
          {
            "name": "http",
            "port": 9200,
            "targetPort": 9200
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "elasticsearch",
        "namespace": "komtas-rm8"
      },
      "spec": {
        "serviceName": "elasticsearch",
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "rm8-elasticsearch"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "rm8-elasticsearch"
            }
          },
          "spec": {
            "enableServiceLinks": false,
            "containers": [
              {
                "name": "elasticsearch",
                "image": "docker.elastic.co/elasticsearch/elasticsearch:9.3.0",
                "ports": [
                  {
                    "containerPort": 9200
                  }
                ],
                "env": [
                  {
                    "name": "discovery.type",
                    "value": "single-node"
                  },
                  {
                    "name": "ES_JAVA_OPTS",
                    "value": "-Xms512m -Xmx512m"
                  },
                  {
                    "name": "xpack.security.enabled",
                    "value": "false"
                  },
                  {
                    "name": "node.store.allow_mmap",
                    "value": "false"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "768Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "1536Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/usr/share/elasticsearch/data"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/_cluster/health",
                    "port": 9200
                  },
                  "failureThreshold": 120,
                  "periodSeconds": 5
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/_cluster/health",
                    "port": 9200
                  },
                  "periodSeconds": 5
                }
              }
            ],
            "securityContext": {
              "fsGroup": 1000
            }
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "2Gi"
                }
              }
            }
          }
        ]
      }
    }
  ]
}

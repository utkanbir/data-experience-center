apiVersion: batch/v1
kind: Job
metadata:
  name: rm8-verify
  namespace: komtas-rm8
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rm8-verify
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: postgres:17.11-bookworm
          command: [psql, --no-psqlrc, -v, ON_ERROR_STOP=1, -f, /sql/verify.sql]
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: komtas_rm8
            - name: PGUSER
              value: rm8_bi
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rm8-credentials
                  key: bi-password
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: rm8-sql

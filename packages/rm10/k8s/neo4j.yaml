{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "neo4j",
        "namespace": "komtas-rm10"
      },
      "spec": {
        "type": "ClusterIP",
        "selector": {
          "app": "rm10-neo4j"
        },
        "ports": [
          {
            "name": "http",
            "port": 7474,
            "targetPort": 7474
          },
          {
            "name": "bolt",
            "port": 7687,
            "targetPort": 7687
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "neo4j",
        "namespace": "komtas-rm10"
      },
      "spec": {
        "serviceName": "neo4j",
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "rm10-neo4j"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "rm10-neo4j"
            }
          },
          "spec": {
            "enableServiceLinks": false,
            "containers": [
              {
                "name": "neo4j",
                "image": "neo4j:5.26.18-community",
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 7474
                  },
                  {
                    "name": "bolt",
                    "containerPort": 7687
                  }
                ],
                "env": [
                  {
                    "name": "NEO4J_AUTH",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "rm10-graph",
                        "key": "auth"
                      }
                    }
                  },
                  {
                    "name": "NEO4J_server_memory_heap_initial__size",
                    "value": "256m"
                  },
                  {
                    "name": "NEO4J_server_memory_heap_max__size",
                    "value": "512m"
                  },
                  {
                    "name": "NEO4J_server_memory_pagecache_size",
                    "value": "256m"
                  },
                  {
                    "name": "NEO4J_server_bolt_advertised__address",
                    "value": "localhost:17697"
                  }
                ],
                "readinessProbe": {
                  "tcpSocket": {
                    "port": 7687
                  },
                  "initialDelaySeconds": 20,
                  "periodSeconds": 5
                },
                "resources": {
                  "requests": {
                    "cpu": "200m",
                    "memory": "768Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "1536Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/data"
                  }
                ]
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "1Gi"
                }
              }
            }
          }
        ]
      }
    }
  ]
}

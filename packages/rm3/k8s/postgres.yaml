apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: komtas-rm3
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: postgres-rm1
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: komtas-rm3
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: postgres-rm1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: komtas-rm3
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-rm1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-rm1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17.11-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: komtas_rm3
            - name: POSTGRES_USER
              value: rm3_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rm3-credentials
                  key: admin-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            exec:
              command: [pg_isready, -U, rm3_admin, -d, komtas_rm3]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, rm3_admin, -d, komtas_rm3]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, rm3_admin, -d, komtas_rm3]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
